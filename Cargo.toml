[package]
name = "jj-format"
version = "1.0.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
minus = { version = "5.8.0", features = ["static_output", "search", "clipboard"] }
regex = "1.12.3"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
